name: Fork Sync & Release

# 定时同步上游 chen08209/FlClash 的「最新正式 release tag」（排除 prerelease，绝不使用未发布的 main 快照），
# 重打本 fork 的包名(com.flclash.fork)与自有签名，构建 Android APK 并发布到与上游同名的 Release tag（如 v0.9.2），版本号完全跟随上游。
on:
  schedule:
    - cron: '17 18 * * *'   # 每天 02:17 (北京时间) 检查上游
  workflow_dispatch:        # 手动触发：无论上游有无更新都会重新构建并发布

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Sync upstream release tag & re-apply fork patches
        id: sync
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 子模块 .gitmodules 使用 SSH URL（git@github.com:...），runner 无 SSH key。
          # 这里把 git@ 重写成 https，否则 sync 阶段 reset 到新 tag 后克隆「新增」子模块
          # （如 v0.9.3 的 plugins/prism_ui）会 Permission denied(publickey)。
          # 注意：actions/checkout 会在其步骤内 unset 全局 insteadOf，故必须在此（checkout 之后）重设。
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          BEFORE=$(git rev-parse HEAD)
          git remote add upstream https://github.com/chen08209/FlClash.git \
            || git remote set-url upstream https://github.com/chen08209/FlClash.git
          # --force：本地可能已有同名 tag（如我们发布时打的 v0.9.2 指向 fork commit），
          # 不覆盖会导致 fetch 返回非零退出码、被 set -e 终止。
          git fetch upstream --tags --force

          # 仅取上游「最新正式发布」tag（排除 prerelease），绝不使用未发布的 main 快照
          TAG=$(gh release list --repo chen08209/FlClash --limit 100 \
                  --json tagName,isPrerelease,publishedAt \
                  --jq '[.[] | select(.isPrerelease==false)] | sort_by(.publishedAt) | reverse | .[0].tagName')
          if [ -z "$TAG" ]; then
            echo "no upstream release found, falling back to upstream/main"
            TAG=upstream/main
          fi
          echo "target upstream tag: $TAG"

          # 把 main 重置为该正式 tag（丢弃分叉提交，避免合并冲突）
          git reset --hard "$TAG"
          git submodule sync --recursive
          git submodule update --init --recursive

          # 恢复本 fork 自己的 CI 工作流目录（重置会把它一并清掉；从本次运行的提交恢复，保留我们对 build.yaml/fork.yml 的自定义）。
          # 先整体删除再 checkout，确保彻底还原成 BEFORE 版（= fork main 现状），既保留我们的自定义，
          # 又让 push 时这些文件相对远端 main 无 diff，避免触发「更新 workflow 文件需 workflows 权限」的拦截。
          rm -rf .github/workflows
          git checkout "$BEFORE" -- .github/workflows/

          # 只重打 applicationId（决定安装身份/签名身份，与签名密钥绑定，从而绕开按原包名 com.follow.clash 的安装限制）。
          # 注意：Dart 的 packageName 常量【不】改——它只用来拼 Flutter 方法通道名，而原生侧由 Components.PACKAGE_NAME
          # 统一定义为 com.follow.clash；该常量同时是自身组件类名前缀（com.follow.clash.MainActivity 等），
          # 改了反而破坏「通道匹配」与「Activity 启动」。所以包名常量保持上游值，让 Dart 与原生通道对得上。
          sed -i 's/^\([[:space:]]*\)applicationId = ".*"/\1applicationId = "com.flclash.fork"/' android/app/build.gradle.kts

          # 修复鸿蒙(HarmonyOS)兼容层导航栏颜色 bug：上游硬编码 systemNavigationBarContrastEnforced: true，
          # 强制系统叠加一层 scrim 遮罩——深色模式下该遮罩在鸿蒙上仍是浅色块（不随深色切换），
          # 浅色模式下则是纯白条，与应用灰色底色不一致。
          # 直接置 false：导航栏在深浅模式下都完全透明，透出 App 自身灰/深色背景，与主题一致；
          # 图标可见性由 systemNavigationBarIconBrightness 控制（深浅模式已分别设 light/dark），无需强制 scrim。
          sed -i 's/^\([[:space:]]*\)systemNavigationBarContrastEnforced: true,/\1systemNavigationBarContrastEnforced: false,/' lib/manager/theme_manager.dart

          git add -A
          # 是否「真正存在上游源码更新」：排除本 fork 维护的 CI 工作流目录（每次 sync 都会恢复它，
          # 属于 fork 自身维护文件，不应触发「上游源码更新」的重建判定）
          REALCHANGED=false
          if ! git diff --cached --quiet -- ':!.github/workflows'; then
            REALCHANGED=true
          fi
          CHANGED=$REALCHANGED
          # 手动触发时总是重新构建并发布
          if [ "$EVENT" = "workflow_dispatch" ]; then CHANGED=true; fi
          # 上游有变化才提交/推送（避免无意义的 force push）；工作流文件随源码提交一起被保留
          if [ "$REALCHANGED" = "true" ]; then
            git commit -m "chore: sync upstream $TAG + fork package patches"
            git push --force origin main
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Android Signing
        if: steps.sync.outputs.changed == 'true'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: steps.sync.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        if: steps.sync.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Setup NDK
        if: steps.sync.outputs.changed == 'true'
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        if: steps.sync.outputs.changed == 'true'
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build APK (core + distributor)
        if: steps.sync.outputs.changed == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        # 只构建 arm64-v8a（--arch arm64），不再产出 armeabi-v7a / x86_64，
        # 覆盖几乎所有现代安卓设备，构建更快、产物更小。
        run: dart setup.dart android --arch arm64 --env stable -v

      - name: Publish release tagged with upstream version
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${{ steps.sync.outputs.target_tag }}   # 上游正式 tag，如 v0.9.2 —— 版本号完全跟随上游
          SRC=$TAG
          # 迁移清理：删除旧的 fork-latest 浮动标签（仅首次生效，之后不存在则忽略）
          git tag -d fork-latest 2>/dev/null || true
          gh release delete fork-latest --cleanup-tag -y 2>/dev/null || true
          # 删除本地可能从 upstream fetch 来的同名 tag（指向原版 commit），避免与 fork 的重签名 tag 冲突
          git tag -d "$TAG" 2>/dev/null || true
          # 同版本重复构建（手动重跑）时删除旧 release 再重建；跨版本则自然累积版本历史
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          NOTES="Automated build synced from upstream chen08209/FlClash @ ${SRC} (formal release tag, NOT a main snapshot). Package: com.flclash.fork (renamed to avoid package-name install restrictions / signature conflicts). Signed with this fork's own keystore. Architecture: arm64-v8a ONLY (covers all modern Android devices; 32-bit armeabi-v7a / x86_64 builds are no longer produced). Version follows upstream tag exactly. Built at $(date -u)."
          gh release create "$TAG" $(find dist -name '*.apk') \
            --title "FlClash Fork ${SRC} ($(date -u +%Y-%m-%d))" \
            --notes "$NOTES"
